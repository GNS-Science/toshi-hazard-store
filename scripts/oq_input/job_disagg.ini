mag_bin_width = 0.1999
coordinate_bin_width = 5.0
num_epsilon_bins = 16
disagg_bin_edges = {'dist': [0.0, 5.0, 10.0, 15.0, 20.0, 30.0, 40.0, 50.0, 60.0, 80.0, 100.0, 140.0, 180.0, 220.0, 260.0, 320.0, 380.0, 500.0]}

[disagg]
