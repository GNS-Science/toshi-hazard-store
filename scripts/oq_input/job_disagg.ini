[general]
random_seed = 25
calculation_mode = disaggregation
ps_grid_spacing = 30
description = disaggregation task: 1

[logic_tree]
number_of_logic_tree_samples = 0

[erf]
rupture_mesh_spacing = 4
width_of_mfd_bin = 0.1
complex_fault_mesh_spacing = 10.0
area_source_discretization = 10.0

[site_params]
reference_vs30_type = measured
reference_vs30_value = 400
reference_depth_to_1pt0km_per_sec = 356.0
reference_depth_to_2pt5km_per_sec = 1.3
site_model_file = sites_disagg.csv

[calculation]
investigation_time = 1.0
truncation_level = 4
maximum_distance = {'Active Shallow Crust': [(4.0, 0), (5.0, 100.0), (6.0, 200.0), (9.5, 300.0)], 'Subduction Interface': [(5.0, 0), (6.0, 200.0), (10, 500.0)], 'Subduction Intraslab': [(5.0, 0), (6.0, 200.0), (10, 500.0)]}
source_model_logic_tree_file = sources/sources.xml
gsim_logic_tree_file = gsim_model.xml

[output]
export_dir = /tmp
individual_curves = true

[disaggregation]
