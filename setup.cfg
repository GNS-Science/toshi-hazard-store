[mypy]
follow_untyped_imports = True
exclude = deaggregate_hazard_mp\.py|scripts/migration/

[mypy-openquake.*]
ignore_missing_imports = True

[mypy-pyiceberg.*]
ignore_missing_imports = True

[coverage:run]
# uncomment the following to omit files during running
#omit =

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    if self.debug:
    if settings.DEBUG
    raise AssertionError
    raise NotImplementedError
    if 0:
    if __name__ == .__main__.:
    def main
    log.debug
    log.info
    if TYPE_CHECKING:
omit =
    toshi_hazard_store/scripts/ths_iceberg.py
    toshi_hazard_store/scripts/migration/**/*.py
    # toshi_hazard_store/scripts/**/*.py

[tox:tox]
isolated_build = true
runner = uv-venv-lock-runner
envlist = audit, py310, py311, py312, format, lint, build-linux, build-macos

[gh-actions]
python =
    3.12: py312
    3.11: py311, format, lint, build
    3.10: py310

[testenv]
extras =
    openquake
allowlist_externals =
    pytest
passenv = *
setenv =
    PYTHONPATH = {toxinidir}
    PYTHONWARNINGS = ignore
commands =
    pytest tests toshi_hazard_store #  this will emit logging output for any failed tests, and fail
    pytest --cov=toshi_hazard_store --cov-branch --cov-report=xml --cov-report=term-missing tests toshi_hazard_store

[testenv:py311-oq{3201,3210,3221,3234,3241,3251}]
runner = uv-venv-lock-runner
basepython = python3.11
extras =
    openquake
allowlist_externals =
    uv
    pytest
passenv = *
setenv =
    PYTHONPATH = {toxinidir}
    PYTHONWARNINGS = ignore
commands_pre =
    # OQ 3.20–3.23 use np.RankWarning which was removed in NumPy 2.0, so we
    # also pin numpy<2 for those envs.  OQ 3.24+ works with any NumPy version.
    oq3201: uv pip install --reinstall-package openquake-engine --reinstall-package numpy "openquake-engine==3.20.1" "numpy<2"
    oq3210: uv pip install --reinstall-package openquake-engine --reinstall-package numpy "openquake-engine==3.21.0" "numpy<2"
    oq3221: uv pip install --reinstall-package openquake-engine --reinstall-package numpy "openquake-engine==3.22.1" "numpy<2"
    oq3234: uv pip install --reinstall-package openquake-engine --reinstall-package numpy "openquake-engine==3.23.4" "numpy<2"
    oq3241: uv pip install --reinstall-package openquake-engine "openquake-engine==3.24.1"
    oq3251: uv pip install --reinstall-package openquake-engine "openquake-engine==3.25.1"
commands =
    pytest -v tests/oq_import/test_extract_disagg_hdf5_versions.py

[testenv:audit]
allowlist_externals =
    uv
commands =
    uv export --all-groups --format requirements-txt -o audit.txt
    uv run pip-audit -r audit.txt
    uv run safety scan

[testenv:format]
allowlist_externals =
    ruff
commands =
    ruff format toshi_hazard_store tests
    ruff check --fix --select I toshi_hazard_store tests

[testenv:lint]
allowlist_externals =
    ruff
    mypy
commands =
    ruff check toshi_hazard_store tests
    mypy toshi_hazard_store tests

[testenv:build-linux]
platform = linux
dependency_groups =
    doc
no_default_groups = false
allowlist_externals =
    uv
    mkdocs
    twine
commands =
    uv build
    mkdocs build
    twine check dist/*

[testenv:build-macos]
platform = darwin
dependency_groups =
    doc
no_default_groups = false
allowlist_externals =
    uv
    mkdocs
    twine
commands =
    uv build
    mkdocs build
    twine check dist/*
